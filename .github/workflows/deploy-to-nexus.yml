name: CI/CD Pipeline

on:
    push:
        branches:
            - main
        tags:
            - 'v*.*.*'
    release:
        types: [published]
    workflow_dispatch:

jobs:
    compile:
        name: 1. Compile Sources & Tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v5
              with:
                  java-version: '25'
                  distribution: 'temurin'
                  cache: 'maven'
            - name: Compile Main & Test Code
              run: mvn clean test-compile -DskipTests=true

    test-and-sonar:
        name: 2. Test, Coverage & SonarCloud
        needs: [compile]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: actions/setup-java@v5
              with:
                  java-version: '25'
                  distribution: 'temurin'
                  cache: 'maven'
            - name: Run Tests, JaCoCo and SonarCloud
              env:
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: mvn test jacoco:report org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.qualitygate.wait=true

    deploy:
        name: 3. Deploy to Nexus Repository
        needs: [compile, test-and-sonar]
        if: |
            always() &&
            !cancelled() &&
            needs.compile.result == 'success'
        runs-on: ubuntu-latest
        env:
            NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
            NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v5
              with:
                  java-version: '25'
                  distribution: 'temurin'
                  cache: 'maven'
                  server-id: nexus-repository
                  server-username: NEXUS_USERNAME
                  server-password: NEXUS_PASSWORD
            - name: Evaluate Deployment Target
              id: eval-deploy
              run: |
                  TAG=""
                  if [ "${{ github.event_name }}" = "release" ]; then
                      TAG="${{ github.event.release.tag_name }}"
                  elif [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
                      TAG="${{ github.ref_name }}"
                  fi

                  IS_RELEASE="false"
                  RELEASE_VERSION=""
                  if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                      IS_RELEASE="true"
                      RELEASE_VERSION="${TAG#v}"
                  fi

                  PROJECT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout 2>/dev/null | tail -n 1)
                  IS_SNAPSHOT="false"
                  SNAPSHOT_VERSION=""
                  if [ "$IS_RELEASE" = "false" ]; then
                      if [[ "$PROJECT_VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+)(-SNAPSHOT)?$ ]]; then
                          IS_SNAPSHOT="true"
                          SNAPSHOT_VERSION="${BASH_REMATCH[1]}-SNAPSHOT"
                      fi
                  fi

                  echo "is_release=$IS_RELEASE" >> "$GITHUB_OUTPUT"
                  echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
                  echo "is_snapshot=$IS_SNAPSHOT" >> "$GITHUB_OUTPUT"
                  echo "snapshot_version=$SNAPSHOT_VERSION" >> "$GITHUB_OUTPUT"

            - name: Validate Release Quality Gate
              if: steps.eval-deploy.outputs.is_release == 'true' && needs.test-and-sonar.result != 'success'
              run: |
                  echo "::error::Release deployment blocked because test-and-sonar phase did not succeed (status: ${{ needs.test-and-sonar.result }})."
                  exit 1

            - name: Publish Release to Nexus
              if: steps.eval-deploy.outputs.is_release == 'true' && needs.test-and-sonar.result == 'success'
              run: |
                  mvn versions:set -DnewVersion="${{ steps.eval-deploy.outputs.release_version }}" -DgenerateBackupPoms=false
                  mvn deploy -Pgenerate-javadoc-and-source,activate-oberon-nexus -DskipTests=true

            - name: Publish Snapshot to Nexus
              if: steps.eval-deploy.outputs.is_snapshot == 'true'
              run: |
                  mvn versions:set -DnewVersion="${{ steps.eval-deploy.outputs.snapshot_version }}" -DgenerateBackupPoms=false
                  mvn deploy -Pgenerate-javadoc-and-source,activate-oberon-nexus -DskipTests=true

            - name: Skip Deployment Notice
              if: steps.eval-deploy.outputs.is_release == 'false' && steps.eval-deploy.outputs.is_snapshot == 'false'
              run: |
                  echo "Skipping deployment: not a valid vx.y.z release tag, and project version does not conform to x.y.z snapshot criteria."