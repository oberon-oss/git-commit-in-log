name: CI/CD Pipeline

on:
    push:
        branches:
            - main
    workflow_dispatch:

jobs:
    compile:
        name: 1. Compile Sources & Tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v5
              with:
                  java-version: '25'
                  distribution: 'temurin'
                  cache: 'maven'
            - name: Compile Main & Test Code
              run: mvn clean test-compile -DskipTests=true

    test:
        name: 2. Run Tests & Coverage
        needs: [compile]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v5
              with:
                  java-version: '25'
                  distribution: 'temurin'
                  cache: 'maven'
            - name: Execute Tests & JaCoCo
              run: mvn test jacoco:report
            - name: Upload JaCoCo Coverage Report
              uses: actions/upload-artifact@v4
              with:
                  name: jacoco-report
                  path: target/site/jacoco/
                  retention-days: 1

    sonar:
        name: 3. SonarCloud Analysis & Quality Gate
        needs: [test]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: actions/setup-java@v5
              with:
                  java-version: '25'
                  distribution: 'temurin'
                  cache: 'maven'
            - name: Download JaCoCo Coverage Report
              uses: actions/download-artifact@v4
              with:
                  name: jacoco-report
                  path: target/site/jacoco
            - name: Run SonarCloud Scanner
              env:
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: >-
                  mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
                  -Dsonar.qualitygate.wait=true

    deploy:
        name: 4. Deploy to Nexus Repository
        needs: [sonar]
        runs-on: ubuntu-latest
        env:
            NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
            NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v5
              with:
                  java-version: '25'
                  distribution: 'temurin'
                  cache: 'maven'
                  server-id: nexus-repository
                  server-username: NEXUS_USERNAME
                  server-password: NEXUS_PASSWORD
            - name: Publish Artifacts to Nexus
              run: mvn deploy -Pgenerate-javadoc-and-source -DskipTests=true